name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # 同时兼容 Repository secret / Repository variable / 备用名：
      # 任一处配置了 NPM_TOKEN（或 ALIYUN_NPM_TOKEN）都能取到
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || vars.NPM_TOKEN || secrets.ALIYUN_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 检查凭据来源
        env:
          FROM_SECRET: ${{ secrets.NPM_TOKEN }}
          FROM_VARIABLE: ${{ vars.NPM_TOKEN }}
          FROM_ALT_SECRET: ${{ secrets.ALIYUN_NPM_TOKEN }}
        run: |
          echo "secret  NPM_TOKEN       长度: ${#FROM_SECRET}"
          echo "variable NPM_TOKEN      长度: ${#FROM_VARIABLE}"
          echo "secret  ALIYUN_NPM_TOKEN 长度: ${#FROM_ALT_SECRET}"
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::三处都没有取到凭据：请在 Settings → Secrets and variables → Actions 的 Repository secrets 中新增 NPM_TOKEN"
            exit 1
          fi

      - name: 注入云效 Packages 凭据
        run: |
          echo "//packages.aliyun.com/676d377c721f4dc7be6ca65a/npm/npm-registry/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc

      - name: 校验 Packages 凭据
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            'https://packages.aliyun.com/676d377c721f4dc7be6ca65a/npm/npm-registry/@vakao-ui%2Faxios')
          echo "registry 探测状态码: ${code}"
          case "$code" in
            200) ;;
            401|403)
              echo "::error::令牌被拒绝（${code}）：请确认是 packages.aliyun.com 生成的访问令牌，且对该仓库有读权限"
              exit 1
              ;;
            *) echo "::warning::registry 返回 ${code}，继续尝试安装" ;;
          esac

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: 代码检查（格式 + lint + 类型）
        run: pnpm check

      - name: 构建
        run: pnpm build
